[package]
name = "vxc"
version = "0.0.1"
edition = "2021"
description = "A heterogeneous-systems programming language that puts placement and reachability in the type system."
authors = ["Aditya"]
license = "Apache-2.0 WITH LLVM-exception"
repository = "https://github.com/vx-lang/Vx"
keywords = ["compiler", "heterogeneous", "mlir", "gpu", "npu"]
categories = ["compilers", "development-tools"]

[lib]
name = "vxc"
path = "src/lib.rs"

[dependencies]
id-arena = "2.2.2"
tempfile = "3.10"
rayon = "1.10"
regex = "1.10"
bytemuck = { version = "1.15", features = ["derive"] }
once_cell = "1.19"
mlir-sys = "220.0.2"
rustc-hash = "2.0"
petgraph = "0.6.5"
# vx_std_core is deliberately NOT a dependency. No code here calls into it -- the compiler names
# `libvx_std_core` as a path when it links a program, never as a Rust API. The edge only ever asked
# for an rlib, while what every test needs is the cdylib, and that comes from `default-members`
# below. Keeping it here would also block publishing: a path dependency with no version is refused.
melior = "0.27.0"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"

[dev-dependencies]

proptest = "1.4"
# Integration tests build their own pools to check determinism across thread counts.
rayon = "1.10"
rstest = "0.19"

[workspace]
members = ["refactor_tool",
    "stdlib/rust_core"
, "vx-analyzer"]

# A bare `cargo build` has to cover stdlib/rust_core as well. Depending on it only asks for an
# rlib to link against; the cdylib the JIT loads at run time is built when the package is
# selected, and nothing selects it by default.
default-members = [".", "stdlib/rust_core"]

[lints.clippy]
if_same_then_else = "allow"

[[bin]]
name = "vxc"
path = "src/main.rs"

# Scratch/experiment binaries. Keep them buildable (`cargo build --bin <name>`)
# but exclude them from `cargo test` so each one does not trigger a slow MLIR
# link for an empty test harness.
[[bin]]
name = "test_loc"
path = "src/bin/test_loc.rs"
test = false
bench = false

[[bin]]
name = "melior_test2"
path = "src/bin/melior_test2.rs"
test = false
bench = false

[[bin]]
name = "cargo-vx-bench"
path = "src/bin/cargo-vx-bench.rs"
test = false
bench = false

# Regenerates `// CHECK:` lines in MLIR tests from actual output
# (`cargo run --bin update_mlir_test_checks -- <test.vx>`).
[[bin]]
name = "update_mlir_test_checks"
path = "utils/update_mlir_test_checks.rs"
test = false
bench = false

# The measurement harnesses (#295/#296). Same reasoning as the scratch binaries
# above: neither contains a `#[test]`, so `cargo test` was building and linking
# an MLIR-sized test binary for each of them in order to run zero tests.
[[bin]]
name = "intern_bench"
path = "src/bin/intern_bench.rs"
test = false
bench = false

[[bin]]
name = "parallel_demo"
path = "src/bin/parallel_demo.rs"
test = false
bench = false

[profile.release]
strip = "debuginfo"      # Strip debuginfo but keep symbols for dynamic linking
lto = "thin"      # Thin LTO drops dead LLVM code without taking 10 minutes to link
codegen-units = 1 # Maximize optimization by compiling as a single unit

[profile.test]
# opt-level 1, not 3. The suite's *execution* is ~2 minutes (172 integration tests; the 426 lib
# tests run in 0.04s), while a pre-commit run takes ~10 -- so roughly 80% of the wall clock is
# compiling and linking test binaries, not running them. Optimizing at 3 pays that cost on every
# rebuild to speed up two minutes of work. 1 keeps the inlining that matters for the tests that
# actually compute (they JIT through MLIR) without the expensive passes.
opt-level = 1
