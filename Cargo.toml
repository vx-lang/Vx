[package]
name = "Vx"
version = "2.0.0"
edition = "2021"
description = "A high-performance systems programming language built from the ground up for heterogeneous computing."
authors = ["Aditya"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/hiraditya/Vx"
keywords = ["compiler", "heterogeneous", "mlir", "gpu", "npu"]
categories = ["compilers", "development-tools"]

[lib]
name = "vxc"
path = "src/lib.rs"

[dependencies]
rayon = "1.10"
regex = "1.10"
bytemuck = { version = "1.15", features = ["derive"] }
once_cell = "1.19"
mlir-sys = "220.0.2"
rustc-hash = "2.0"
petgraph = "0.6.5"
vx_std_core = { path = "stdlib/rust_core" }
melior = "0.27.0"
clap = { version = "4.4", features = ["derive"] }

[dev-dependencies]

proptest = "1.4"
rstest = "0.19"

[workspace]
members = ["refactor_tool",
    "stdlib/rust_core"
]

[lints.clippy]
if_same_then_else = "allow"

[[bin]]
name = "vxc"
path = "src/main.rs"

[profile.release]
strip = true      # Automatically strip symbols from the binary (~90% size reduction)
lto = "thin"      # Thin LTO drops dead LLVM code without taking 10 minutes to link
codegen-units = 1 # Maximize optimization by compiling as a single unit

[profile.test]
opt-level = 3     # Run tests with optimizations to reduce runtime CI duration
