[package]
name = "vx-config"
version = "0.1.0"
edition = "2021"
description = "Project configuration for Vx tools"
license = "Apache-2.0 WITH LLVM-exception"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
tempfile = "3.10"
