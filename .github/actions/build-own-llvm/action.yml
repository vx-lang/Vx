name: Build our own LLVM
description: >
  Make sure the GitHub Actions cache holds the LLVM that scripts/provision/build_llvm.sh builds for
  this runner, building and saving it if it does not. The cache key changes whenever that script
  does (it pins the LLVM and Enzyme commits). Building takes about an hour and a half on a Linux
  runner.

inputs:
  restore:
    description: >
      'true' to leave the LLVM in toolchain/install for the rest of the job. 'false' only makes sure
      the cache has it, without downloading it when it does.
    default: 'true'

outputs:
  key:
    description: The cache key the LLVM is saved under.
    value: ${{ steps.key.outputs.key }}

runs:
  using: composite
  steps:
    # ImageOS names the runner's OS release (ubuntu22, ubuntu24): a build for one may not run on
    # another.
    - name: Cache key
      id: key
      shell: bash
      run: echo "key=llvm-$ImageOS-${{ runner.arch }}-${{ hashFiles('scripts/provision/build_llvm.sh') }}" >> "$GITHUB_OUTPUT"

    - name: Look for LLVM in the cache
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: toolchain/install
        key: ${{ steps.key.outputs.key }}
        lookup-only: ${{ inputs.restore != 'true' }}

    # The source and build directories need about 8 GB next to the install, more than the
    # runner has free. These preinstalled SDKs are not used by any job here.
    - name: Free disk space
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h /

    # The source and build directories are deleted afterwards, so a job that goes on to build Vx
    # has the space back.
    - name: Build LLVM
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        sudo apt-get install -y ninja-build cmake
        JOBS=$(nproc) ./scripts/provision/build_llvm.sh || {
          tail -n 100 toolchain/build/*.log
          exit 1
        }
        rm -rf toolchain/src toolchain/build
        du -sh toolchain/install

    - name: Save LLVM to the cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: toolchain/install
        key: ${{ steps.key.outputs.key }}
