name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest # Free Linux Tier
    env:
      # Link with lld (installed below) -- much faster than the default linker
      # for the large MLIR/LLVM libraries that get linked into many binaries.
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install LLVM 22
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev libmlir-22-dev mlir-22-tools libpolly-22-dev libclang-22-dev ninja-build cmake z3 lld
          echo "/usr/lib/llvm-22/bin" >> $GITHUB_PATH

      - name: Check for locking primitives
        run: |
          if grep -rE '(Mutex|RwLock|Condvar|OnceLock|OnceCell|Semaphore|ShardedLock|DashMap|parking_lot|spin::|std::thread::park)' src/; then
            echo "Error: Locking primitives or thread-parking mechanisms are not allowed in the Vx compiler!"
            exit 1
          fi

      # Process-global atomics are banned for the same reason as locks: a compilation must be
      # isolated, and a static a worker thread can write is shared mutable state whether or not
      # it takes a lock to do it. A cached answer also survives across compilations in a long-lived
      # process (the LSP daemon), so compile N+1 can read what compile N left behind.
      #
      # Matched on the type names rather than the word "atomic", because the word appears in prose
      # -- "**Atomic**: returns false and leaves the stream untouched" is a doc comment about
      # all-or-nothing lowering, not a primitive. A lint that cannot tell those apart gets
      # disabled the first time it is wrong.
      #
      # A line that genuinely needs one carries `vx-lint: allow-atomic` with a reason. Today the
      # only holdout is src/intern_mode.rs, whose mode flags and phase timers are the measurement
      # scaffolding the benchmarks read (Vx#381).
      - name: Check for process-global atomics
        run: |
          if grep -rnE '(std::sync::atomic|Atomic(Bool|Ptr|I8|U8|I16|U16|I32|U32|I64|U64|Isize|Usize))' src/ \
               | grep -v 'vx-lint: allow-atomic'; then
            echo "Error: process-global atomics are not allowed in the Vx compiler!"
            echo "A compilation must be isolated; a static a worker can write is shared mutable state."
            echo "If a line genuinely needs one, mark it 'vx-lint: allow-atomic' with a reason."
            exit 1
          fi

      - name: Check Rust Formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Check Vx Formatting (vx-format)
        run: |
          cargo build --release --bin vx-format
          find tests stdlib -name "*.vx" -exec ./target/release/vx-format {} +
          git diff --exit-code || (echo "Vx files are not formatted properly. Run vx-format locally." && exit 1)

      - name: Check Markdown Formatting (mdformat)
        run: |
          pipx install mdformat
          mdformat --check docs/ README.md

      - name: Install Enzyme
        run: |
          chmod +x scripts/provision/install_enzyme.sh
          ./scripts/provision/install_enzyme.sh
          ENZYME_LIB=$(find $(pwd)/.cargo/enzyme -name 'LLVMEnzyme*.so' | head -n 1)
          echo "ENZYME_LIB=$ENZYME_LIB" >> $GITHUB_ENV

      # Clippy has gated commits through scripts/pre-commit.sh for a long time but never gated
      # CI, so a lint only failed for whoever had the hook installed. Same flags as the hook, so
      # the two cannot disagree about what is clean.
      #
      # --workspace because the build and test steps below already use it: without it the three
      # member crates are compiled by CI and linted by nothing.
      - name: Check Lints (cargo clippy)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --release --workspace --verbose

      - name: Run tests
        run: cargo test --release --workspace --verbose
        env:
          LLVM_CONFIG_PATH: llvm-config-22
          MLIR_TRANSLATE_PATH: mlir-translate-22
          OPT_PATH: opt-22
          LLC_PATH: llc-22
          CLANG_PATH: clang-22

      # The pipeline's claims -- same bytes at any thread count, isolated compilations,
      # parity with the AST oracle -- named so a gate silenced with #[ignore] fails the build.
      - name: Parallel pipeline gates
        env:
          LLVM_CONFIG_PATH: llvm-config-22
          MLIR_TRANSLATE_PATH: mlir-translate-22
          OPT_PATH: opt-22
          LLC_PATH: llc-22
          CLANG_PATH: clang-22
        run: |
          set -euo pipefail
          run_gate () {
            local target="$1" name="$2"
            echo "== $name"
            if ! out=$(cargo test --release $target -- --exact "$name" --nocapture 2>&1); then
              echo "$out"
              echo "GATE FAILED: $name"
              exit 1
            fi
            echo "$out" | grep -q "1 passed" || {
              echo "$out"
              echo "GATE MISSING: $name did not run (silenced or renamed?)"
              exit 1
            }
            # Numbers a passing gate reports are the point of running it by name.
            echo "$out" | grep -E "^(flat path:|flat decline:|identical MLIR)" || true
          }

          # Determinism: the frontend emits the same bytes however many threads it uses.
          run_gate "--lib" pipeline::gid_stream_tests::pipeline_emits_byte_identical_mlir_across_thread_counts
          run_gate "--lib" pipeline::gid_stream_tests::hir_stream_is_deterministic_across_thread_counts
          run_gate "--lib" pipeline::gid_stream_tests::flat_type_stream_order_is_deterministic_across_thread_counts
          run_gate "--lib" pipeline::gid_stream_tests::memalg_constructs_are_deterministic_across_thread_counts

          # Isolation: concurrent compilations in one process cannot see each other.
          run_gate "--test integration_test" integration_test::architecture_test::concurrent_compilations_have_isolated_topologies

          # Refusal: the parallel frontend rejects the machine models the driver rejects.
          run_gate "--lib" pipeline::gid_stream_tests::the_pipeline_refuses_a_declaration_model_the_driver_would_refuse

          # Parity: what the parallel pipeline emits still matches the AST oracle.
          run_gate "--test integration_test" integration_test::flat_codegen_differential::pipeline_emits_mlir_that_matches_the_ast_oracle

          # Coverage: how much of the backend corpus the flat path carries (Vx#383).
          run_gate "--test integration_test" integration_test::flat_corpus_sweep::flat_path_coverage_of_the_backend_corpus_holds

          # Scale: the same 16,000 functions the 5.89x was measured on, still byte-identical.
          run_gate "--test integration_test" integration_test::pipeline_scale_test::pipeline_emits_identical_mlir_at_benchmark_scale

      - name: Run stress tests (Every 10th Commit)
        run: |
          if [ $((GITHUB_RUN_NUMBER % 10)) -eq 0 ]; then
            echo "Running stress tests for run $GITHUB_RUN_NUMBER"
            cargo test --release --test stress_test -- --ignored
          else
            echo "Skipping stress tests. They run every 10th commit (current run: $GITHUB_RUN_NUMBER)."
          fi

      - name: Run benchmarks (Every 10th Commit, offset by 1)
        run: |
          if [ $(((GITHUB_RUN_NUMBER + 1) % 10)) -eq 0 ]; then
            echo "Running benchmarks for run $GITHUB_RUN_NUMBER"
            cargo bench --workspace --verbose
          else
            echo "Skipping benchmarks. They run every 10th commit offset by 1 (current run: $GITHUB_RUN_NUMBER)."
          fi

  # The release job above never runs a line of debug-only code: 15 `#[cfg(debug_assertions)]`
  # blocks, 33 `debug_assert!` calls, and the integer overflow checks the dev profile turns on.
  # That includes every hook into parallel_architecture_verifier, so the pipeline's own
  # phase-by-phase invariants were checked by nothing outside a developer's pre-commit run.
  #
  # Its own job rather than another step, so it runs alongside the release job instead of
  # extending it, and gets its own build cache instead of evicting the release one.
  test-debug:
    name: Run Tests (debug profile)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install LLVM 22
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev libmlir-22-dev mlir-22-tools libpolly-22-dev libclang-22-dev ninja-build cmake z3 lld
          echo "/usr/lib/llvm-22/bin" >> $GITHUB_PATH

      - name: Install Enzyme
        run: |
          chmod +x scripts/provision/install_enzyme.sh
          ./scripts/provision/install_enzyme.sh
          ENZYME_LIB=$(find $(pwd)/.cargo/enzyme -name 'LLVMEnzyme*.so' | head -n 1)
          echo "ENZYME_LIB=$ENZYME_LIB" >> $GITHUB_ENV

      # Every test that runs a program links stdlib/rust_core's cdylib at run time, and
      # `cargo test` never emits it: a dependency edge only ever asks for an rlib. The release
      # job happens to be covered by its own build step; this one had nothing, so 117 of its
      # tests failed on a missing file.
      #
      # Deliberately the bare form rather than `--workspace`: that is what a new contributor
      # types, and it only produces the library because the workspace names stdlib/rust_core in
      # `default-members`. If that entry is ever dropped, this step fails here rather than in
      # someone's first clone.
      - name: Build
        run: cargo build --verbose

      - name: Run tests (debug)
        run: cargo test --workspace --verbose
        env:
          LLVM_CONFIG_PATH: llvm-config-22
          MLIR_TRANSLATE_PATH: mlir-translate-22
          OPT_PATH: opt-22
          LLC_PATH: llc-22
          CLANG_PATH: clang-22
