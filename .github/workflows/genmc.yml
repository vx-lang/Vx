name: GenMC

# Checks the LLVM IR that vxc generates for the Mutex, the channel and Arc, with GenMC under
# RC11. See formal/compiled/README.md.
on:
  push:
    branches: [ main ]
    paths: [ 'formal/compiled/**', 'stdlib/core/sync/**', 'stdlib/std/sync/**',
             'src/dialect/VxLowering.cpp', '.github/workflows/genmc.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'formal/compiled/**', 'stdlib/core/sync/**', 'stdlib/std/sync/**',
             'src/dialect/VxLowering.cpp', '.github/workflows/genmc.yml' ]
  workflow_dispatch:

env:
  GENMC_COMMIT: fab5bba

jobs:
  genmc:
    name: Check the compiled library with GenMC
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The LLVM of ci.yml. It builds vxc, and its clang, opt and llvm-link make the IR.
      - name: Get our own LLVM
        id: llvm
        uses: ./.github/actions/build-own-llvm

      - name: Use our own LLVM
        uses: ./.github/actions/use-own-llvm
        with:
          key: ${{ steps.llvm.outputs.key }}

      # GenMC links the shared libLLVM, which our own LLVM does not build. So GenMC uses the
      # LLVM 22 of apt.llvm.org.
      - name: Add apt.llvm.org
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-22 main" |
            sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq libllvm22 libffi-dev

      # ImageOS names the OS release of the runner (ubuntu24), as in build-own-llvm.
      - name: GenMC cache key
        id: genmc-key
        run: echo "key=genmc-$ImageOS-llvm22-$GENMC_COMMIT-${{ hashFiles('formal/compiled/genmc.patch') }}" >> "$GITHUB_OUTPUT"

      - name: Cache GenMC
        id: genmc-cache
        uses: actions/cache@v4
        with:
          path: ~/genmc
          key: ${{ steps.genmc-key.outputs.key }}

      - name: Build GenMC
        if: steps.genmc-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y -qq llvm-22-dev clang-22 zlib1g-dev libedit-dev libzstd-dev libxml2-dev
          git clone -q https://github.com/MPI-SWS/genmc.git "$RUNNER_TEMP/genmc"
          cd "$RUNNER_TEMP/genmc"
          git checkout -q "$GENMC_COMMIT"
          git apply "$GITHUB_WORKSPACE/formal/compiled/genmc.patch"
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/usr/lib/llvm-22/lib/cmake \
            -DCMAKE_INSTALL_PREFIX="$HOME/genmc"
          cmake --build build -j "$(nproc)"
          cmake --install build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: genmc-${{ steps.llvm.outputs.key }}

      - name: Build vxc
        run: cargo build --release --bin vxc

      - name: Run GenMC on each client
        run: |
          python3 formal/compiled/run_genmc.py --genmc "$HOME/genmc/bin/genmc" \
            --vxc target/release/vxc --llvm-bin "$GITHUB_WORKSPACE/toolchain/install/bin"
