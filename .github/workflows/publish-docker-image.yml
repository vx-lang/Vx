name: Publish vx-build image

on:
  push:
    tags: ['v*']

jobs:
  publish:
    if: github.repository == 'vx-lang/Vx'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.build
          build-args: LLVM_VERSION=22
          tags: ghcr.io/vx-lang/vx-build:llvm22
          push: true
