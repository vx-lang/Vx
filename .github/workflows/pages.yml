name: Deploy vxlang.org

# The website: a hand-written landing page plus the book, built with mdBook from the markdown in
# www/book/src and served under /docs/.
on:
  push:
    branches: [ main ]
    paths:
      - 'www/**'
      # The per-code diagnostic pages are generated from the compiler's diagnostic table and
      # the fixtures that assert each code, so a change to either changes the site.
      - 'src/diagnostic.rs'
      - 'tests/**'
      - 'scripts/tools/gen_error_pages.py'
      - 'scripts/tools/gen_site_metadata.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queued rather than cancelled, so a run that is already publishing
# finishes rather than leaving the site half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: '0.5.4'

    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          set -euo pipefail
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "$url" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the book
        run: mdbook build www/book

      # One page per diagnostic code, so an error pasted into a search engine has somewhere to
      # land. Generated rather than committed: the content comes from src/diagnostic.rs and the
      # fixtures, and 121 pages of build output do not belong in the tree.
      - name: Generate the diagnostic pages
        run: |
          set -euo pipefail
          python3 scripts/tools/gen_error_pages.py
          pages=$(find www/errors -mindepth 2 -name index.html | wc -l)
          codes=$(grep -cE '^    [EW][0-9]{4},$' src/diagnostic.rs)
          if [ "$pages" -ne "$codes" ]; then
            echo "Generated $pages pages for $codes declared codes."
            exit 1
          fi
          echo "$pages diagnostic pages, one per declared code."

      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site

          # The landing page and its assets sit at the root.
          cp www/index.html   _site/
          cp www/style.css    _site/
          cp www/favicon.svg  _site/
          cp www/install.sh   _site/
          cp www/CNAME        _site/
          cp www/ai-usage.html _site/

          # The book is served under /docs/.
          mkdir -p _site/docs
          cp -R www/book/book/* _site/docs/

          # The blog is hand-written HTML under /blog/, sharing the landing page's stylesheet.
          # No generator: posts are infrequent, and a build step is a thing that can rot.
          cp -R www/blog _site/blog

          # One directory per code, so /errors/E6003 resolves without a .html suffix.
          cp -R www/errors _site/errors

          # A 404 that looks like the site rather than like GitHub.
          cp www/index.html _site/404.html

      # Canonical links, licence, schema.org records and the citation line on every page,
      # plus robots.txt, sitemap.xml, llms.txt and the TDM record. Run over the assembled
      # site rather than the sources: it is the only place that sees the book, which mdBook
      # renders with a head no file in this repository controls.
      - name: Generate the site metadata
        run: python3 scripts/tools/gen_site_metadata.py --site _site

      - name: Check the install script is valid shell
        run: sh -n _site/install.sh

      - name: Check for broken internal links
        run: |
          set -euo pipefail
          # Every root-relative href on the landing page should resolve to a file in the built
          # site. Failures are collected to a file rather than a variable: the loop runs in a
          # subshell, so an assignment inside it would not survive to the exit check.
          # The landing page plus the generated diagnostic pages, which link into the book by
          # section and to each other. Deduplicated first: 121 pages share a handful of targets.
          find _site/errors -name index.html -print0 \
            | xargs -0 grep -ho 'href="/[^"]*"' \
            | cat - <(grep -o 'href="/[^"]*"' _site/index.html) \
            | sed 's/href="//; s/"$//' \
            | sort -u > /tmp/links.txt

          : > /tmp/broken.txt
          while read -r link; do
            case "$link" in
              */) target="_site${link}index.html" ;;
              *)  target="_site${link}" ;;
            esac
            [ -e "$target" ] || echo "  $link  (expected $target)" >> /tmp/broken.txt
          done < /tmp/links.txt

          if [ -s /tmp/broken.txt ]; then
            echo "Broken internal links on the landing page:"
            cat /tmp/broken.txt
            exit 1
          fi
          echo "All $(wc -l < /tmp/links.txt) internal links resolve."

      - uses: actions/configure-pages@v5
        if: ${{ github.repository == 'vx-lang/Vx' }}

      - uses: actions/upload-pages-artifact@v3
        if: ${{ github.repository == 'vx-lang/Vx' }}
        with:
          path: _site

  deploy:
    if: ${{ github.repository == 'vx-lang/Vx' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
