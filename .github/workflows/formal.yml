name: Formal model

# Checks the memory model in formal/memory_model: herd7 runs the litmus tests on vx.cat, Lean
# checks the proofs, and run_lean.py checks that the Lean definitions agree with vx.cat.
# memalloy needs local patches to build, so formal/memory_model/memalloy is checked by hand.
# TLC checks the models of the runtime protocols in formal/runtime.
on:
  push:
    branches: [ main ]
    paths: [ 'formal/**', '.github/workflows/formal.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'formal/**', '.github/workflows/formal.yml' ]

jobs:
  memory-model:
    name: Check the memory model
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.2'
          dune-cache: true

      - name: Install herd7
        run: opam install -y herdtools7.7.58

      - name: Cache Lean
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            formal/memory_model/lean/.lake
          key: lean-${{ hashFiles('formal/memory_model/lean/lean-toolchain', 'formal/memory_model/lean/**/*.lean') }}
          restore-keys: lean-

      # `lake -d` runs from the repository root, where elan finds no lean-toolchain file, so
      # make that file's version the default.
      - name: Install Lean
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh |
            sh -s -- -y --default-toolchain "$(cat formal/memory_model/lean/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # --wfail fails on warnings, so a proof left as `sorry` fails the build.
      - name: Check the Lean proofs
        run: lake -d formal/memory_model/lean build --wfail

      - name: Run the litmus tests on vx.cat
        run: opam exec -- python3 formal/memory_model/run_litmus.py

      - name: Check that the Lean model agrees with vx.cat
        run: opam exec -- python3 formal/memory_model/run_lean.py

  runtime-protocols:
    name: Check the protocols of the runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The nightly release of TLC changes. So use a fixed release and check its hash.
      - name: Install TLC
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" |
            sha256sum -c -

      - name: Run TLC on the models and on each mistake
        run: TLA2TOOLS="$RUNNER_TEMP/tla2tools.jar" python3 formal/runtime/run_tlc.py
