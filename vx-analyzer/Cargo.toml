[package]
name = "vx-analyzer"
# Same product as `vxc`, so it shares the version from `[workspace.package]`.
version.workspace = true
edition = "2024"

[dependencies]
vxc = { path = ".." }
clap = { version = "4.4", features = ["derive"] }
lsp-server = "0.7.6"
lsp-types = "0.95.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
log = "0.4"
env_logger = "0.11"
