\* Two fibers and one thread. The thread and one fiber wait on word "a", and the
\* other fiber waits on word "b". The deadlock watcher is off, because it makes the model
\* about ten times larger. run_tlc.py changes these constants for each model.
CONSTANTS
    Fibers = {"f1", "f2"}
    Threads = {"t1"}
    OnB = {"f2"}
    OnC = {}
    OnWorker = {}
    OnIo = {}
    Timed = {}
    Seed = FALSE
    SpuriousLimit = 2
    Watch = FALSE
    SetWords = TRUE
    Cancel = TRUE
    Bug = "none"
SPECIFICATION Spec
INVARIANTS
    NoFailedCheck
    TheWatcherCountsEachSleeper
    EachWaiterHasANote
    ReadyOnce
    NoFalseDeadlock
PROPERTIES
    EachWaitEnds
    DeadlockIsReported
CHECK_DEADLOCK FALSE
